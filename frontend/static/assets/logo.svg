<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="160" height="40">
  <defs>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Lens icon -->
  <!-- Outer circle (lens ring) -->
  <circle cx="20" cy="20" r="13" fill="none" stroke="url(#lensGrad)" stroke-width="2.5"/>

  <!-- Inner lens highlight -->
  <circle cx="20" cy="20" r="8" fill="url(#glowGrad)"/>

  <!-- DNA helix lines inside lens -->
  <path d="M14 17 Q17 15 20 17 Q23 19 26 17" fill="none" stroke="url(#lensGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M14 20 Q17 22 20 20 Q23 18 26 20" fill="none" stroke="url(#lensGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M14 23 Q17 21 20 23 Q23 25 26 23" fill="none" stroke="url(#lensGrad)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Handle -->
  <line x1="30" y1="30" x2="36" y2="36" stroke="url(#lensGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Wordmark: Skilly -->
  <text x="44" y="25"
    font-family="'Segoe UI', 'Inter', sans-serif"
    font-weight="700"
    font-size="16"
    fill="#f1f5f9"
    letter-spacing="-0.3">Skilly</text>

  <!-- Wordmark: Lens (accent color) -->
  <text x="84" y="25"
    font-family="'Segoe UI', 'Inter', sans-serif"
    font-weight="700"
    font-size="16"
    fill="url(#lensGrad)"
    letter-spacing="-0.3">Lens</text>
</svg>