{% extends 'base.html' %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card card">
    <h2 class="gradient-text" style="margin-bottom:0.25rem">Welcome Back</h2>
    <p style="color:var(--text-muted);margin-bottom:1.5rem;font-size:0.9rem">Login to view your analysis history</p>

    <div id="error-msg" class="error-box" style="display:none"></div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" class="form-input">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" class="form-input">
    </div>
    <button onclick="handleLogin()" class="btn-primary" style="width:100%;padding:0.8rem;font-size:1rem;margin-top:0.5rem">
      Login
    </button>
    <p style="text-align:center;margin-top:1rem;color:var(--text-muted);font-size:0.9rem">
      No account? <a href="/signup" style="color:var(--accent)">Sign up free</a>
    </p>
    <p style="text-align:center;margin-top:0.5rem;font-size:0.85rem;color:var(--text-muted)">
      Or <a href="/upload" style="color:var(--accent)">continue without login →</a>
    </p>
  </div>
</div>

<style>
.auth-wrapper { display:flex; justify-content:center; align-items:center; min-height:80vh; padding:2rem; }
.auth-card { width:100%; max-width:420px; }
.form-group { margin-bottom:1rem; }
.form-group label { display:block; margin-bottom:0.4rem; font-size:0.85rem; color:var(--text-sub); }
.form-input {
  width:100%; padding:0.75rem 1rem;
  background:var(--bg-elevated); border:1px solid var(--border);
  border-radius:8px; color:var(--text); font-size:0.95rem;
  transition:border-color 0.2s;
}
.form-input:focus { outline:none; border-color:var(--accent); }
.error-box {
  background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3);
  color:#ef4444; padding:0.75rem; border-radius:8px; margin-bottom:1rem; font-size:0.875rem;
}
</style>

<script>
async function handleLogin() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  if (!email || !password) { showError('Please fill all fields'); return; }
  const res = await fetch('/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  });
  const data = await res.json();
  if (data.success) window.location.href = '/upload';
  else showError(data.error || 'Login failed');
}
function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg; el.style.display = 'block';
}
</script>
{% endblock %}
