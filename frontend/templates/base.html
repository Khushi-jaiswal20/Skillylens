<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillyLens — Your Career DNA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">
  <img src="/static/assets/logo.svg" alt="SkillyLens">
</a>
        
        <div class="nav-links">
            <a href="/upload">Analyze Resume</a>
            <a href="/chatbot">Skilly Mentor👩‍🏫</a>
            <a href="/about">About</a>
            {% if session.user_id %}
    <a href="/profile" style="color:var(--accent)">👤 {{ session.user_name }}</a>
    <a href="/logout" class="btn-outline">Logout</a>
{% else %}
    <a href="/login" class="btn-primary">Login</a>
{% endif %}
        </div>
        
    </nav>
    <main>{% block content %}{% endblock %}</main>
    <script src="/static/js/main.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
