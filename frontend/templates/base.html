<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillyLens — Your Career DNA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
    <script>
        (function() {
        var t = localStorage.getItem('sl-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">
  <img src="/static/assets/logo.svg" alt="SkillyLens">
</a>
        
        <div class="nav-links">
            <!-- Theme toggle — nav-links ke andar sabse pehle -->
<button id="themeToggle" onclick="toggleTheme()"
  style="background:var(--bg-elevated);
         border:1px solid var(--border);
         color:var(--text-sub);
         padding:0.35rem 0.8rem;
         border-radius:20px;
         font-size:0.8rem;
         cursor:pointer;
         display:flex;
         align-items:center;
         gap:0.4rem;
         transition:all 0.2s">
  <span id="themeIcon">☀️</span>
  <span id="themeLabel">Light</span>
</button>
            <a href="/upload">Analyze Resume</a>
            <a href="/chatbot">Skilly Mentor👩‍🏫</a>
            <a href="/about">About</a>
            {% if session.user_id %}
    <a href="/profile" style="color:var(--accent)">👤 {{ session.user_name }}</a>
    <a href="/logout" class="btn-outline">Logout</a>
{% else %}
    <a href="/login" class="btn-primary">Login</a>
{% endif %}
        </div>
        
    </nav>
    <main>{% block content %}{% endblock %}</main>
    <script src="/static/js/main.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
